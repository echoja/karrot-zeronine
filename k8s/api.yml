apiVersion: apps/v1
kind: Deployment
metadata:
  name: karrot-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: karrot-api
  template:
    metadata:
      labels:
        app: karrot-api
    spec:
      containers:
        - name: karrot-api
          image: karrot-zeronine-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/karrot_zeronine
            - name: SPRING_DATASOURCE_USERNAME
              value: karrot
            - name: SPRING_DATASOURCE_PASSWORD
              value: karrot123
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: REDISSON_SINGLESERVERCONFIG_ADDRESS
              value: redis://redis:6379
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: karrot-api
spec:
  type: NodePort
  selector:
    app: karrot-api
  ports:
    - port: 8080
      targetPort: 8080
